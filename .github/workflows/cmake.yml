name: CMake

on:
  workflow_call:
    inputs:
      build_type:
        description: Type of build (Debug, Release, RelWithDebInfo)
        type: string
        default: Debug
      upload_artifacts:
        description: Should upload artifacts or not
        type: boolean
        default: false
      run_tests:
        description: Run CTest after project build
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install packages
      run: |
          sudo apt-get update
          sudo apt-get install libglfw3-dev libglfw3 libglew-dev libopenal-dev libluajit-5.1-dev libvorbis-dev libcurl4-openssl-dev libfmt-dev libspdlog-dev libgtest-dev
          sudo ln -s /usr/lib/x86_64-linux-gnu/libluajit-5.1.a /usr/lib/x86_64-linux-gnu/liblua-5.1.a
          sudo ln -s /usr/include/luajit-2.1 /usr/include/lua
          git clone --branch v3.16.0 https://github.com/skypjack/entt.git
          cd entt/build
          cmake -DCMAKE_BUILD_TYPE=Release -DENTT_INSTALL=on ..
          sudo make install
          cd ../..

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{inputs.build_type}} -DChromaForge_BUILD_TESTS=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{inputs.build_type}}

    - name: Run tests
      if: ${{ inputs.run_tests }}
      run: ctest --test-dir ${{github.workspace}}/build

    - name: Run Lua integration tests
      if: ${{ inputs.run_tests }}
      run: |
        chmod +x build/vctest/vctest build/ChromaForge
        build/vctest/vctest -e build/ChromaForge -d dev/tests -u build
      timeout-minutes: 1

    - name: Upload artifacts
      if: ${{ inputs.upload_artifacts }}
      uses: actions/upload-artifact@v4
      with:
        name: ChromaForge
        path: |
          build/ChromaForge
          res/*
