name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - run: echo "Building release ${{ steps.version.outputs.VERSION }}"

  build_linux:
    needs: [prepare]
    uses: ./.github/workflows/appimage.yml
    with:
      build_name: '${{ needs.prepare.outputs.build_name }}'

  build_macos:
    needs: [prepare]
    uses: ./.github/workflows/macos.yml
    with:
      build_name: '${{ needs.prepare.outputs.build_name }}'

  build_windows:
    needs: [prepare]
    uses: ./.github/workflows/windows.yml
    with:
      build_name: '${{ needs.prepare.outputs.build_name }}'

  publish_release:
    runs-on: ubuntu-latest
    needs: [build_linux, build_macos, build_windows]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Package release files
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        VERSION="${VERSION#v}"
        mkdir release

        # Linux AppImage
        if [ -f ./artifacts/AppImage/*.AppImage ]; then
          cp ./artifacts/AppImage/*.AppImage \
             ./release/chromaforge-${VERSION}_x86-64.AppImage
        fi

        # macOS DMG
        if [ -f ./artifacts/ChromaForgeMacOs/*.dmg ]; then
          cp ./artifacts/ChromaForgeMacOs/*.dmg \
             ./release/chromaforge-${VERSION}_macos.dmg
        fi

        # Windows ZIP
        if [ -d ./artifacts/Windows-Build ]; then
          (cd ./artifacts/Windows-Build && \
           zip -r ../../release/chromaforge-${VERSION}_win64.zip .)
        fi

        ls -la ./release

    - name: Create Release Draft
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        draft: true
        files: |
          ./release/*
        generate_release_notes: true
